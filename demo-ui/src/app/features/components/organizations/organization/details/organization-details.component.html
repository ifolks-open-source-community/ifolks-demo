<app-private-template>
<app-organization-menu  #menu [activePath]="activePath" [id]="id"></app-organization-menu>

<h2>
{{ 'organizationDetails' | i18n }}
</h2>

<div class="details-form" >
<form [formGroup]="form" (ngSubmit)="update()">
<p>
<mat-form-field appearance="outline" floatLabel="always">
<mat-label>{{ 'organizationCode' | i18n }}</mat-label>
<input matInput placeholder="{{ 'organizationCode' | i18n }}" formControlName="code"/>
</mat-form-field>
</p>

<p>
<mat-form-field appearance="outline" floatLabel="always">
<mat-label>{{ 'organizationDescription' | i18n }}</mat-label>
<textarea matInput placeholder="{{ 'organizationDescription' | i18n }}" formControlName="description" cdkTextareaAutosize></textarea>
</mat-form-field>
</p>

<p>
@if (view.canUpdate) {
  <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">{{ 'update' | i18n }}</button>
}
</p>
</form>
<!-- Specific Code Start -->
<!-- Specific Code End -->
</div>
</app-private-template>
