<app-private-template>
<h2>
{{ 'stupidList' | i18n }}: {{scrollView.count}} / {{scrollView.size}}
</h2>

<form [formGroup]="filter">
<mat-form-field appearance="outline" floatLabel="always">
<mat-label>{{ 'stupidCode' | i18n }}</mat-label>
<input matInput placeholder="{{ 'stupidCode' | i18n }}" formControlName="code"/>
</mat-form-field>
<mat-form-field appearance="outline" floatLabel="always">
<mat-label>{{ 'stupidFoolCode' | i18n }}</mat-label>
<input matInput placeholder="{{ 'stupidFoolCode' | i18n }}" formControlName="foolCode"/>
</mat-form-field>
</form>
<mat-table [dataSource]="dataSource" matSort>
<ng-container matColumnDef="code">
<mat-header-cell *matHeaderCellDef mat-sort-header class="table-header">{{ 'stupidCode' | i18n }}</mat-header-cell>
<mat-cell *matCellDef="let element"> {{element.code}} </mat-cell>
</ng-container>
<ng-container matColumnDef="foolCode">
<mat-header-cell *matHeaderCellDef mat-sort-header class="table-header">{{ 'stupidFoolCode' | i18n }}</mat-header-cell>
<mat-cell *matCellDef="let element"> {{element.foolCode}} </mat-cell>
</ng-container>
<ng-container matColumnDef="Actions">
<mat-header-cell *matHeaderCellDef class="table-header">{{ 'actions' | i18n }}</mat-header-cell>
<mat-cell *matCellDef="let element">
<a class="margin-10" (click)="edit(element.id)"><mat-icon aria-label="Edit" svgIcon="pencil" class="text-success"></mat-icon></a>
@if (element.canDelete) {
  <a class="margin-10" (click)="delete(element.id)"><mat-icon aria-label="Delete" svgIcon="delete" class="text-warn"></mat-icon></a>
}
</mat-cell>
</ng-container>
<mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
<mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
</mat-table>
<mat-paginator #paginator [length]="scrollView.count"
[pageSize]="scrollForm.elementsPerPage"
[showFirstLastButtons]="true"
[pageSizeOptions]="pageSizeOptions">
</mat-paginator>

<button mat-raised-button (click)="create()" color="primary">
{{ 'create' | i18n }}
</button>
<!-- Specific Code Start -->
<!-- Specific Code End -->
</app-private-template>
