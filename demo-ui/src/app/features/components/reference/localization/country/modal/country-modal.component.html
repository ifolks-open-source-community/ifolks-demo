<div class="modal-form" >
<form [formGroup]="form" (ngSubmit)="saveOrUpdate()">
<mat-dialog-content class="text-grey-darker">
<div>
<button mat-icon-button mat-dialog-close disableRipple>
<mat-icon class="text-grey" svgIcon="close"></mat-icon>
</button>
</div>
<section>
<p>
<mat-form-field appearance="outline" floatLabel="always">
<mat-label>{{ 'countryCode' | i18n }}</mat-label>
<input matInput placeholder="{{ 'countryCode' | i18n }}" formControlName="code"/>
</mat-form-field>
</p>

<p>
<mat-form-field appearance="outline" floatLabel="always">
<mat-label>{{ 'countryLabel' | i18n }}</mat-label>
<input matInput placeholder="{{ 'countryLabel' | i18n }}" formControlName="label"/>
</mat-form-field>
</p>

</section>
</mat-dialog-content>
<mat-dialog-actions>
@if (view.id == null) {
  <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">{{ 'save' | i18n }}</button>
}
@if (view.id != null && view.canUpdate) {
  <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">{{ 'update' | i18n }}</button>
}
</mat-dialog-actions>
</form>
<!-- Specific Code Start -->
<!-- Specific Code End -->
</div>
