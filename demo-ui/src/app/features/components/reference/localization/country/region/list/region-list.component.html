<app-private-template>
<app-country-menu  #menu [activePath]="activePath" [id]="id"></app-country-menu>

<h2>
{{ 'regionList' | i18n }}: {{scrollView.count}} / {{scrollView.size}}
</h2>

<form [formGroup]="filter">
<mat-form-field appearance="outline" floatLabel="always">
<mat-label>{{ 'regionCode' | i18n }}</mat-label>
<input matInput placeholder="{{ 'regionCode' | i18n }}" formControlName="code"/>
</mat-form-field>
<mat-form-field appearance="outline" floatLabel="always">
<mat-label>{{ 'regionLabel' | i18n }}</mat-label>
<input matInput placeholder="{{ 'regionLabel' | i18n }}" formControlName="label"/>
</mat-form-field>
</form>
<mat-table [dataSource]="dataSource" matSort>
<ng-container matColumnDef="code">
<mat-header-cell *matHeaderCellDef mat-sort-header class="table-header">{{ 'regionCode' | i18n }}</mat-header-cell>
<mat-cell *matCellDef="let element"> {{element.code}} </mat-cell>
</ng-container>
<ng-container matColumnDef="label">
<mat-header-cell *matHeaderCellDef mat-sort-header class="table-header">{{ 'regionLabel' | i18n }}</mat-header-cell>
<mat-cell *matCellDef="let element"> {{element.label}} </mat-cell>
</ng-container>
<ng-container matColumnDef="Actions">
<mat-header-cell *matHeaderCellDef class="table-header">{{ 'actions' | i18n }}</mat-header-cell>
<mat-cell *matCellDef="let element">
<a class="margin-10" href="{{'/region/' + element.id}}"><mat-icon aria-label="Edit" svgIcon="table-edit" class="text-success"></mat-icon></a>
<a class="margin-10" (click)="edit(element.id)"><mat-icon aria-label="Edit" svgIcon="pencil" class="text-success"></mat-icon></a>
@if (element.canDelete) {
  <a class="margin-10" (click)="delete(element.id)"><mat-icon aria-label="Delete" svgIcon="delete" class="text-warn"></mat-icon></a>
}
</mat-cell>
</ng-container>
<mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
<mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
</mat-table>
<mat-paginator #paginator [length]="scrollView.count"
[pageSize]="scrollForm.elementsPerPage"
[showFirstLastButtons]="true"
[pageSizeOptions]="pageSizeOptions">
</mat-paginator>

<button mat-raised-button (click)="create()" color="primary">
{{ 'create' | i18n }}
</button>
<!-- Specific Code Start -->
<!-- Specific Code End -->
</app-private-template>
