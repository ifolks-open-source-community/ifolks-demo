<app-private-template>
<app-city-menu  #menu [activePath]="activePath" [id]="id"></app-city-menu>

<h2>
{{ 'cityDetails' | i18n }}
</h2>

<div class="details-form" >
<form [formGroup]="form" (ngSubmit)="update()">
<p>
<mat-form-field appearance="outline" floatLabel="always">
<mat-label>{{ 'cityRegionCountryCode' | i18n }}</mat-label>
<mat-select placeholder="{{ 'cityRegionCountryCode' | i18n }}" formControlName="regionCountryCode" >
<mat-option [value]="null"></mat-option>
@for (option of regionCountryCodeOptions; track option.key) {
  <mat-option [value]="option.key">{{option.label}}</mat-option>
}
</mat-select>
</mat-form-field>
</p>

<p>
<mat-form-field appearance="outline" floatLabel="always">
<mat-label>{{ 'cityRegionCode' | i18n }}</mat-label>
<input matInput placeholder="{{ 'cityRegionCode' | i18n }}" formControlName="regionCode"/>
</mat-form-field>
</p>

<p>
<mat-form-field appearance="outline" floatLabel="always">
<mat-label>{{ 'cityCode' | i18n }}</mat-label>
<input matInput placeholder="{{ 'cityCode' | i18n }}" formControlName="code"/>
</mat-form-field>
</p>

<p>
<mat-form-field appearance="outline" floatLabel="always">
<mat-label>{{ 'cityLabel' | i18n }}</mat-label>
<input matInput placeholder="{{ 'cityLabel' | i18n }}" formControlName="label"/>
</mat-form-field>
</p>

<p>
@if (view.canUpdate) {
  <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">{{ 'update' | i18n }}</button>
}
</p>
</form>
<!-- Specific Code Start -->
<!-- Specific Code End -->
</div>
</app-private-template>
